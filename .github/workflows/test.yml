name: test

on: [pull_request]

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:ut
      - if: always()
        uses: davelosert/vitest-coverage-report-action@v2
  
  types:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:types
      - run: npm run test:types:lib

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run test:lint
